<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kviz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Student Fun Zone - Kviz</h1>

        <div id="quiz">

            <h2 id="question">Pitanje</h2>

            <div id="answers"></div>

            <button id="nextBtn">Sljedeće pitanje</button>

        </div>

        <div id="result" class="hidden">

            <h2>Kviz završen!</h2>

            <p id="score"></p>

            <p id="bestScore"></p>

            <button id="restartBtn">Pokušaj ponovo</button>

            <button id="emailBtn">Pošalji rezultat mailom</button>

        </div>

    </div>

    <script src="javascript.js"></script>

</body>
</html>
